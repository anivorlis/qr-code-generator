<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Generator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='7' height='7' rx='1'/%3E%3Crect x='14' y='3' width='7' height='7' rx='1'/%3E%3Crect x='3' y='14' width='7' height='7' rx='1'/%3E%3Cpath d='M14 14h3v3h-3zM21 14v.01M14 21v.01M21 21v.01M17.5 17.5v.01'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <header class="card-header">
      <div>
        <h1>QR Code Generator</h1>
        <p class="tagline">Turn any link into a scannable code.</p>
      </div>
      <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Open settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <form id="qr-form" class="qr-form">
      <label class="mode-label">
        <span>Type</span>
        <select id="mode">
          <option value="url" selected>URL</option>
          <option value="text">Text</option>
          <option value="wifi">Wi-Fi</option>
          <option value="email">Email</option>
          <option value="vcard">Contact (vCard)</option>
        </select>
      </label>

      <fieldset class="mode-fields" data-mode="url">
        <input type="text" id="url-input" placeholder="https://example.com" autocomplete="off" required />
      </fieldset>

      <fieldset class="mode-fields" data-mode="text" hidden disabled>
        <textarea id="text-input" rows="3" placeholder="Any text to encode" required></textarea>
      </fieldset>

      <fieldset class="mode-fields" data-mode="wifi" hidden disabled>
        <input type="text" id="wifi-ssid" placeholder="Network name (SSID)" autocomplete="off" required />
        <input type="text" id="wifi-password" placeholder="Password" autocomplete="off" required />
        <div class="field-row">
          <select id="wifi-security">
            <option value="WPA" selected>WPA/WPA2</option>
            <option value="WEP">WEP</option>
            <option value="nopass">No password</option>
          </select>
          <label class="checkbox">
            <input type="checkbox" id="wifi-hidden" />
            Hidden network
          </label>
        </div>
      </fieldset>

      <fieldset class="mode-fields" data-mode="email" hidden disabled>
        <input type="email" id="email-to" placeholder="Recipient email" autocomplete="off" required />
        <input type="text" id="email-subject" placeholder="Subject (optional)" autocomplete="off" />
        <textarea id="email-body" rows="2" placeholder="Message (optional)"></textarea>
      </fieldset>

      <fieldset class="mode-fields" data-mode="vcard" hidden disabled>
        <input type="text" id="vcard-name" placeholder="Full name" autocomplete="off" required />
        <input type="tel" id="vcard-phone" placeholder="Phone (optional)" autocomplete="off" />
        <input type="email" id="vcard-email" placeholder="Email (optional)" autocomplete="off" />
        <input type="text" id="vcard-org" placeholder="Company (optional)" autocomplete="off" />
        <input type="text" id="vcard-url" placeholder="Website (optional)" autocomplete="off" />
      </fieldset>

      <button type="submit" id="generate-btn" class="primary-btn">Generate</button>
    </form>

    <p id="warning-msg" class="warning hidden"></p>
    <p id="error-msg" class="error hidden"></p>

    <div id="qr-container" class="qr-container">
      <div id="qr-placeholder" class="qr-placeholder">
        <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          <path d="M14 14h3v3h-3zM21 14v.01M14 21v.01M21 21v.01M17.5 17.5v.01"></path>
        </svg>
        <span>Your QR code will appear here</span>
      </div>
      <img id="qr-image" class="hidden" alt="Generated QR code" />
    </div>

    <div class="actions">
      <button id="copy-btn" class="secondary-btn" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        Copy
      </button>
      <button id="download-btn" class="secondary-btn" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path>
        </svg>
        Download
      </button>
      <button id="link-btn" class="secondary-btn" disabled title="Copy a URL that regenerates this QR code (logo not included)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        Copy link
      </button>
    </div>
  </main>

  <dialog id="settings-dialog">
    <form method="dialog" class="settings-form">
      <h2>Settings</h2>
      <label>
        Foreground color
        <input type="color" id="fg-color" value="#000000" />
      </label>
      <label>
        Background color
        <input type="color" id="bg-color" value="#ffffff" />
      </label>
      <label>
        Size (scale)
        <input type="range" id="scale" min="4" max="20" value="10" />
        <output id="scale-value">10</output>
      </label>
      <label>
        Border (quiet zone)
        <input type="range" id="border" min="0" max="10" value="4" />
        <output id="border-value">4</output>
      </label>
      <label>
        Error correction
        <select id="error-level">
          <option value="l">L — low (7%)</option>
          <option value="m" selected>M — medium (15%)</option>
          <option value="q">Q — quartile (25%)</option>
          <option value="h">H — high (30%)</option>
        </select>
      </label>
      <label>
        Format
        <select id="format">
          <option value="png" selected>PNG</option>
          <option value="svg">SVG</option>
        </select>
      </label>
      <label class="logo-row">
        Logo (optional)
        <input type="file" id="logo-input" accept="image/*" />
      </label>
      <p class="hint">A logo forces PNG output and high error correction.</p>
      <div class="settings-actions">
        <button type="button" id="logo-clear" class="link-btn hidden">Remove logo</button>
        <button type="submit" class="primary-btn">Done</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
